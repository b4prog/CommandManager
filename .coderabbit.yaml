# Configuration for the CodeRabbit GitHub app installed on this repository.
# https://docs.coderabbit.ai/getting-started/yaml-configuration
language: en-US

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    base_branches:
      - ".*"

chat:
  auto_reply: true
