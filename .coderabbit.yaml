# Configuration for the CodeRabbit GitHub app installed on this repository.
# https://docs.coderabbit.ai/getting-started/yaml-configuration
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

chat:
  auto_reply: true
